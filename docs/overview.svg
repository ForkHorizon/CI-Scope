<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">CI Scope in one minute</title>
  <desc id="d">A developer or an AI assistant proposes a change on GitHub. CI Scope loads the checks the owner chose, a program on the owner's Mac runs them, and GitHub shows pass or fail with a reason. Relaxing a rule needs the owner's fingerprint.</desc>
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #f2f2f2; }
    .cap { font-size: 12px; letter-spacing: 1.8px; fill: #adadad; }
    .big { font-size: 34px; font-weight: 700; }
    .lead { font-size: 15px; fill: #cfcfcf; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #bdbdbd; }
    .no { font-size: 12px; letter-spacing: 1.6px; fill: #6f6f6f; }
    .card { fill: url(#cardfill); stroke: #3d3d3d; stroke-width: 1.5; }
    .tile { fill: #000; stroke: #4a4a4a; stroke-width: 1.5; }
    .ico { fill: none; stroke: #f2f2f2; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .link { fill: none; stroke: #7a7a7a; stroke-width: 1.5; }
    .ok { fill: #07130c; stroke: #4dd985; stroke-width: 1.5; }
    .bad { fill: #170607; stroke: #d61a21; stroke-width: 1.5; }
    .dot { fill: #4dd985; }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#7a7a7a"/></marker>
    <linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151515"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="560" fill="#000"/>
  <rect width="1280" height="260" fill="url(#glow)"/>

  <text x="40" y="54" class="cap">CI SCOPE · IN ONE MINUTE</text>
  <text x="40" y="104" class="big">Checks every code change before it ships.</text>
  <text x="40" y="140" class="lead">AI assistants write more and more code. CI Scope makes sure their work is checked by rules they cannot quietly loosen.</text>

  <rect class="card" x="40" y="186" width="270" height="186" rx="16"/>
  <rect class="tile" x="60" y="206" width="48" height="48" rx="12"/>
  <g class="ico" transform="translate(72 218)"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M6 7.5v9M18 16.5V11a4 4 0 0 0-4-4h-3M13 4l-2.5 3 2.5 3"/></g>
  <text x="290" y="236" class="no" text-anchor="end">01</text>
  <text x="60" y="286" class="h">A change is proposed</text>
  <text x="60" y="313" class="s">A developer or an AI</text>
  <text x="60" y="333" class="s">assistant proposes a change</text>
  <text x="60" y="353" class="s">on GitHub.</text>
  <path class="link" d="M316 279 L344 279" marker-end="url(#ah)"/>
  <circle class="dot" r="3"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M316 279 L344 279"/></circle>
  <rect class="card" x="350" y="186" width="270" height="186" rx="16"/>
  <rect class="tile" x="370" y="206" width="48" height="48" rx="12"/>
  <g class="ico" transform="translate(382 218)"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></g>
  <text x="600" y="236" class="no" text-anchor="end">02</text>
  <text x="370" y="286" class="h">The rules are loaded</text>
  <text x="370" y="313" class="s">CI Scope loads the checks the</text>
  <text x="370" y="333" class="s">owner chose. They are kept on</text>
  <text x="370" y="353" class="s">a website an AI can't reach.</text>
  <path class="link" d="M626 279 L654 279" marker-end="url(#ah)"/>
  <circle class="dot" r="3"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M626 279 L654 279"/></circle>
  <rect class="card" x="660" y="186" width="270" height="186" rx="16"/>
  <rect class="tile" x="680" y="206" width="48" height="48" rx="12"/>
  <g class="ico" transform="translate(692 218)"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10l3 2.5-3 2.5M12 16h5"/></g>
  <text x="910" y="236" class="no" text-anchor="end">03</text>
  <text x="680" y="286" class="h">The checks run</text>
  <text x="680" y="313" class="s">A program on the owner's Mac</text>
  <text x="680" y="333" class="s">runs them. Nothing is added</text>
  <text x="680" y="353" class="s">to the project itself.</text>
  <path class="link" d="M936 279 L964 279" marker-end="url(#ah)"/>
  <circle class="dot" r="3"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M936 279 L964 279"/></circle>
  <rect class="card" x="970" y="186" width="270" height="186" rx="16"/>
  <rect class="tile" x="990" y="206" width="48" height="48" rx="12" style="stroke:#4dd985"/>
  <g class="ico" transform="translate(1002 218)" style="stroke:#4dd985"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6.5"/></g>
  <text x="1220" y="236" class="no" text-anchor="end">04</text>
  <text x="990" y="286" class="h">A verdict comes back</text>
  <text x="990" y="313" class="s">GitHub shows pass or fail,</text>
  <text x="990" y="333" class="s">with a plain-language reason.</text>

  <text x="40" y="414" class="cap">WHAT YOU SEE IN GITHUB</text>
  <text x="1240" y="414" class="no" text-anchor="end">ILLUSTRATIVE RESULTS</text>
  <rect class="ok" x="40" y="428" width="580" height="60" rx="14"/>
  <circle cx="74" cy="458" r="12" fill="#4dd985"/><path d="M68 458l4.5 4.5 8.5-9.5" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="102" y="463" style="font-size:15px">CI Scope: PASSED — all checks passed</text>
  <rect class="bad" x="660" y="428" width="580" height="60" rx="14"/>
  <circle cx="694" cy="458" r="12" fill="#d61a21"/><path d="M688.5 452.5l11 11M699.5 452.5l-11 11" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="722" y="463" style="font-size:15px">CI Scope: FAILED — protected files were modified</text>

  <g class="ico" transform="translate(40 516) scale(0.9)"><rect x="3" y="10" width="14" height="10" rx="2"/><path d="M6 10V7a4 4 0 0 1 8 0v3"/></g>
  <text x="68" y="531" class="lead">Loosening a rule takes the owner's fingerprint (Touch ID) on the website, so an AI cannot weaken its own checks.</text>
  
</svg>
