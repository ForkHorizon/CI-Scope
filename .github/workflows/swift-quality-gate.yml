name: Swift Quality Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      mode:
        description: Files to scan
        required: false
        default: all
        type: choice
        options:
          - all
          - changed
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: swift-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-quality-gate:
    uses: ForkHorizon/ci-gates/.github/workflows/swift-quality.yml@main
    with:
      mode: ${{ inputs.mode || 'auto' }}
      # Swift Compile Gate already builds the project; skip the duplicate build.
      run-build: false
