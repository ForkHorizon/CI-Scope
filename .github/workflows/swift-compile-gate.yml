name: Swift Compile Gate

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: swift-compile-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-compile-gate:
    uses: ForkHorizon/ci-gates/.github/workflows/swift-compile.yml@main
