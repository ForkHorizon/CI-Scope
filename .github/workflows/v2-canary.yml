name: CI Scope v2 Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-scope-v2-canary
  cancel-in-progress: false

jobs:
  same-label-a:
    name: Same-label canary A
    uses: ForkHorizon/ci-gates/.github/workflows/code-linter.yml@a94e73b2f0935bd11f47f269f1c18bc9469daaa4
    with:
      runner-group: ci-scope-v2-canary
      runner-labels: '["self-hosted", "macOS", "ARM64", "ci-scope-v2"]'
      runner-label: self-hosted
      routing-generation: v2
      workflow-contract-version: v2
      trust-fixture-mode: canary-only
      gates-ref: a94e73b2f0935bd11f47f269f1c18bc9469daaa4
      mode: all

  same-label-b:
    name: Same-label canary B
    uses: ForkHorizon/ci-gates/.github/workflows/code-linter.yml@a94e73b2f0935bd11f47f269f1c18bc9469daaa4
    with:
      runner-group: ci-scope-v2-canary
      runner-labels: '["self-hosted", "macOS", "ARM64", "ci-scope-v2"]'
      runner-label: self-hosted
      routing-generation: v2
      workflow-contract-version: v2
